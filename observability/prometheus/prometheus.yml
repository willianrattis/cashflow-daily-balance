global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cashflowentryservice
    metrics_path: /metrics
    static_configs:
      - targets: ["cashflowentryservice:8080"]

  - job_name: consolidationservice
    metrics_path: /metrics
    static_configs:
      - targets: ["consolidationservice:8080"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
