# Local reference topology (docs/diagrams/svg/Deployment-Local.svg). One PostgreSQL server hosts two
# logical databases (cashflow_entry_db, consolidation_db) with no cross-service table access; RabbitMQ is
# the transport, never the source of truth (ADR-001, ADR-002, ADR-006).
#
# All credentials/keys below are throwaway local-dev values, documented here on purpose
# (ADR-007) — never reuse them outside this compose file.

services:
  postgres:
    image: postgres:17.6-alpine3.21
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow-dev-only
      POSTGRES_DB: cashflow_entry_db
      # Non-superuser, least-privilege roles each service connects with (docs/05 §1).
      # cashflow (above) stays a superuser for scripts/ops/* and scripts/postgres/*.
      CASHFLOW_ENTRY_SVC_PASSWORD: entry-svc-dev-only
      CONSOLIDATION_SVC_PASSWORD: consolidation-svc-dev-only
    ports:
      - "5433:5432" # host 5433 to avoid clashing with a locally installed/other-project PostgreSQL on 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow_entry_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1.1-management-alpine
    hostname: rabbitmq # the node name (derived from the hostname) must stay stable across
                        # restarts/recreates for Mnesia to find its data directory again
                        # under rabbitmq-data; without it, a fresh random hostname would
                        # make the node start "empty" even with the volume attached.
    environment:
      RABBITMQ_DEFAULT_USER: cashflow
      RABBITMQ_DEFAULT_PASS: cashflow-dev-only
    ports:
      - "5672:5672"
      - "15672:15672" # management UI
      - "15692:15692" # Prometheus scrape endpoint (rabbitmq_prometheus plugin)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./scripts/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./scripts/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  cashflowentryservice:
    build:
      context: .
      dockerfile: src/CashFlowEntryService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Maximum Pool Size=40 in both services: 40 + 40 stays below the 97 non-superuser slots of
      # PostgreSQL's max_connections=100, leaving room for migrations and scripts/ops (docs/01 A-029).
      ConnectionStrings__CashFlowEntryDb: "Host=postgres;Port=5432;Database=cashflow_entry_db;Username=cashflow_entry_svc;Password=entry-svc-dev-only;Maximum Pool Size=40"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: cashflow
      RabbitMq__Password: cashflow-dev-only
      Jwt__Issuer: cashflow-dev-issuer
      Jwt__Audience: cashflow-api
      Jwt__SigningKey: cashflow-local-dev-signing-key-32-bytes-minimum-change-me
    ports:
      - "5101:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # No rabbitmq entry here on purpose (NFR-A): CashFlowEntryService must come up healthy on a cold
      # start even with the broker down, so its own readiness can never wait on it.

  consolidationservice:
    build:
      context: .
      dockerfile: src/ConsolidationService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ConsolidationDb: "Host=postgres;Port=5432;Database=consolidation_db;Username=consolidation_svc;Password=consolidation-svc-dev-only;Maximum Pool Size=40"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: cashflow
      RabbitMq__Password: cashflow-dev-only
      Jwt__Issuer: cashflow-dev-issuer
      Jwt__Audience: cashflow-api
      Jwt__SigningKey: cashflow-local-dev-signing-key-32-bytes-minimum-change-me
    ports:
      - "5102:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - cashflowentryservice
      - consolidationservice

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cashflow-dev-only
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
